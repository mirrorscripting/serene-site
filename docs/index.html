<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Serene — 2026 Calendars</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero">
    <div class="hero-card">
      <h1>The 2026 Calendars</h1>
      <p class="subtitle">13-Month & 12-Month • $10 each</p>
      <p class="micro">Astrological • clean • cute • readable 💎</p>
      <p class="micro">Each purchase includes <b>all color palettes</b> (Core seasonal, Deluxe, Color Pop).</p>
    </div>
  </header>

  <main class="wrap">
    <section id="grid" class="grid"></section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p>© 2026 Serene. All rights reserved.</p>
    </div>
  </footer>

  <!-- PayPal SDK — sandbox ready. This shows PayPal + Card. 
       When you go live, replace client-id=sb with your real client id. -->
  <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD&components=buttons&enable-funding=card,venmo"></script>

  <script>
  // ---------------- PRODUCTS (2 SKUs) ----------------
  const PRODUCTS = [
    {
      id: "cal-13",
      title: "13-Month Calendar (all colors)",
      price: "10.00",
      preview: "previews/13-bundle-preview.pdf",
      thanks: "Thank you for your purchase 💖<br/>Attached are your 2026 calendars. You received all three color palettes: ♥ Core seasonal ♥ Deluxe ♥ Color Pop<br/><br/>Preview tip: print A4 landscape or view on any device.<br/>Plan thoughtfully for your days — they all matter.<br/><br/>Love,<br/>Serene ♥"
    },
    {
      id: "cal-12",
      title: "12-Month Calendar (all colors)",
      price: "10.00",
      preview: "previews/12-bundle-preview.pdf",
      thanks: "Thank you for your purchase 💖<br/>Attached are your 2026 calendars. You received all three color palettes: ♥ Core seasonal ♥ Deluxe ♥ Color Pop<br/><br/>Preview tip: print A4 landscape or view on any device.<br/>Plan thoughtfully for your days — they all matter.<br/><br/>Love,<br/>Serene ♥"
    }
  ];

  // ---------------- UI ----------------
  function cardHTML(p) {
    return `
      <article class="card">
        <div class="card-head">
          <span class="badge">Calendar</span>
        </div>
        <h3>${p.title}</h3>
        <p class="blurb">Includes Core seasonal, Deluxe, and Color Pop palettes.</p>
        <div class="actions">
          <a class="btn ghost" href="${p.preview}" target="_blank" rel="noopener">Preview PDF</a>
          <div class="btn-area">
            <div id="ppbtn-${p.id}"></div>
          </div>
        </div>
      </article>
    `;
  }

  function render() {
    const grid = document.getElementById("grid");
    grid.innerHTML = PRODUCTS.map(cardHTML).join("");

    // Mount PayPal buttons for each product (PayPal + Card)
    PRODUCTS.forEach(p => {
      paypal.Buttons({
        style: {
          shape: "pill",
          layout: "horizontal",
          height: 45,
          label: "buynow"
        },
        // Create order on PayPal (no server needed for basic buy-now)
        createOrder: (data, actions) => {
          return actions.order.create({
            purchase_units: [{
              description: p.title,
              amount: { value: p.price, currency_code: "USD" },
              items: [{
                name: p.title,
                unit_amount: { value: p.price, currency_code: "USD" },
                quantity: "1"
              }]
            }]
          });
        },
        // Capture client-side (sandbox). In production, you’d capture on server.
        onApprove: async (data, actions) => {
          await actions.order.capture();

          // Show an on-page confirmation (email delivery done by your backend/automation)
          const slot = document.querySelector(`#ppbtn-${p.id}`).parentElement;
          slot.innerHTML = `
            <div class="notice success">
              <div class="title">Payment received 💖</div>
              <div>Please check your email for your download links.
              If nothing arrives within a few minutes, check spam or contact us.</div>
            </div>
          `;
          window.scrollTo({ top: 0, behavior: "smooth" });
        },
        onError: (err) => {
          console.error(err);
          const slot = document.querySelector(`#ppbtn-${p.id}`).parentElement;
          slot.innerHTML = `
            <div class="notice error">
              <div class="title">Payment error</div>
              <div>Please try again or use a different method.</div>
            </div>
          `;
        }
      }).render(`#ppbtn-${p.id}`);
    });
  }

  render();
  </script>
</body>
</html>
