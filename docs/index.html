k<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Serene — 2026 Calendars</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero">
    <div class="hero-card">
      <h1>The 2026 Calendars</h1>
      <p class="subtitle">13-Month & 12-Month • $10 each</p>
      <p class="micro">Astrological • clean • cute • readable 💎</p>
      <p class="micro">Each purchase includes <b>all color palettes</b> (Core seasonal, Deluxe, Color Pop).</p>
    </div>
  </header>

  <main class="wrap">
    <section id="grid" class="grid"></section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p>© 2026 Serene. All rights reserved.</p>
    </div>
  </footer>

  <!-- PayPal SDK -->
  <!-- IMPORTANT: replace YOUR_CLIENT_ID with your real PayPal client id when you go live -->
  <script src="https://www.paypal.com/sdk/js?client-id=AcpBHhv12FpAc0hWgWSezT4aCQNGhlGhmb1OUwkQS1gagxwi45BNDXDvrofr5dDbNWsmBQt1rjY2rrAr&currency=USD&components=buttons&enable-funding=card,credit"></script>

  <script>
  // ---------- PRODUCTS (2 SKUs) ----------
  // preview = one-page preview PDF
  // download = the full calendar file buyers get (used by your email automation, not on the button)
  const PRODUCTS = [
    {
      id: "cal-13",
      title: "13-Month Calendar (all colors)",
      price: "10.00",
      preview: "previews/13-bundle-preview.pdf",
      download: "downloads/13/core-2026-v1.pdf"
    },
    {
      id: "cal-12",
      title: "12-Month Calendar (all colors)",
      price: "10.00",
      preview: "previews/12-bundle-preview.pdf",
      download: "downloads/12/core-2026-v1.pdf"
    }
  ];

  // shown after successful capture (buyers will get email via your automation)
  const THANKYOU = `
    <div class="notice success">
      <div class="title">Payment received 💖</div>
      <div>Please check your email for your download links. If nothing arrives within a few minutes, check spam or contact us.</div>
    </div>
  `;

  // ---------- UI ----------
  function cardHTML(p) {
    return `
      <article class="card">
        <div class="card-head"><span class="badge">Calendar</span></div>
        <h3>${p.title}</h3>
        <p class="blurb">Includes Core seasonal, Deluxe, and Color Pop palettes.</p>
        <div class="actions">
          <a class="btn ghost" href="${p.preview}" target="_blank" rel="noopener">Preview PDF</a>
          <div class="btn-area"><div id="ppbtn-${p.id}"></div></div>
        </div>
      </article>
    `;
  }

  function mountPayPalButtons(p) {
    paypal.Buttons({
      style: {
        shape: "pill",
        layout: "horizontal",
        height: 45,
        label: "buynow"
      },
      createOrder: (data, actions) => {
        return actions.order.create({
          purchase_units: [{
            description: p.title,
            amount: { value: p.price, currency_code: "USD" },
            items: [{
              name: p.title,
              unit_amount: { value: p.price, currency_code: "USD" },
              quantity: "1"
            }]
          }]
        });
      },
      onApprove: async (data, actions) => {
        try {
          await actions.order.capture();
          // replace the button with a thank-you note
          const host = document.querySelector(`#ppbtn-${p.id}`).parentElement;
          host.innerHTML = THANKYOU;
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (e) {
          console.error(e);
          alert("Payment captured, but something went odd. Please check your email for the receipt.");
        }
      },
      onError: (err) => {
        console.error(err);
        alert("Payment error. Please try again or use a different method.");
      }
      // NOTE: do NOT set fundingSource — that would hide card; we enabled card via the SDK query string.
    }).render(`#ppbtn-${p.id}`);
  }

  function render() {
    const grid = document.getElementById("grid");
    grid.innerHTML = PRODUCTS.map(cardHTML).join("");
    PRODUCTS.forEach(mountPayPalButtons);
  }

  render();
  </script>
</body>
</html>
